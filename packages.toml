# Packages counted on the profile downloads card.
# Only list packages people install directly.
# the per-platform npm binaries (@grafeo-db/js-linux-x64-gnu, ...) are not, because
# the main package pulls those in.

pypi = [
  "grafeo",
  "grafeo-memory",
  "grafeo-mcp",
  "grafeo-langchain",
  "grafeo-llamaindex",
  "grafeo-cuda",
  "anywidget-graph",
  "anywidget-vector",
  "anywidget-archimate",
  "solvor",
  "gwp-py",
]
crates = ["grafeo", "grafeo-core", "grafeo-cli", "boltr", "gwp"]
docker = ["grafeo/grafeo-server"]
nuget = ["Grafeo"]
npm = [
  "@grafeo-db/js",
  "@grafeo-db/wasm",
  "@grafeo-db/wasm-lite",
  "@grafeo-db/web",
  "@grafeo-db/cli",
  "gwp-js",
]
github = ["GrafeoDB/grafeo"]  # release archives of the grafeo CLI; checksum files are not counted
pubdev = ["grafeo"]  # pub.dev only reports the last 30 days
