name: Download stats and bonsai

on:
  schedule:
    - cron: "0 6 * * 0" # Sundays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # leaves room for building gitbonsai while it has no release
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags since v8, so there is no @v10 to follow.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run tests
        run: uv run pytest -q

      - name: Fetch downloads and render cards
        run: uv run python -m downloads
        env:
          PEPY_API_KEY: ${{ secrets.PEPY_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }} # release download counts; avoids the shared-runner rate limit

      # The bonsai comes from gitbonsai's latest release, or is built from source while there is none. If any
      # bonsai step fails, the current bonsai SVGs stay and the download cards still get committed.
      - name: Check for a gitbonsai release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo StevenBtw/gitbonsai > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No gitbonsai release yet; building it from source."
          fi

      - name: Set up Rust (gitbonsai's pinned toolchain)
        if: steps.release.outputs.exists != 'true'
        continue-on-error: true
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Build gitbonsai from source
        id: built
        if: steps.release.outputs.exists != 'true'
        continue-on-error: true
        run: |
          # SVG only: the default png feature pulls in resvg, which the profile does not need.
          cargo install --locked --no-default-features --git https://github.com/StevenBtw/gitbonsai --root /tmp/gb-build
          mkdir -p /tmp/gb && cp /tmp/gb-build/bin/gitbonsai /tmp/gb/gitbonsai
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install gitbonsai (latest release)
        id: gitbonsai
        if: steps.release.outputs.exists == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gb
          gh release download --repo StevenBtw/gitbonsai --pattern 'gitbonsai-x86_64-unknown-linux-musl.tar.gz*' --dir /tmp/gb
          (cd /tmp/gb && sha256sum -c gitbonsai-x86_64-unknown-linux-musl.tar.gz.sha256)
          tar -xzf /tmp/gb/gitbonsai-x86_64-unknown-linux-musl.tar.gz -C /tmp/gb
          /tmp/gb/gitbonsai --version || true
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Grow the bonsai
        if: steps.gitbonsai.outputs.ready == 'true' || steps.built.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /tmp/gb/gitbonsai collect StevenBtw --output /tmp/gb/snapshot.json
          /tmp/gb/gitbonsai render /tmp/gb/snapshot.json --output-dir /tmp/gb/out
          cp /tmp/gb/out/bonsai-light.svg /tmp/gb/out/bonsai-dark.svg assets/

      # Commits as github-actions[bot], so the weekly update never counts as Steven's contribution.
      - name: Commit updated cards
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update download stats and bonsai"
          file_pattern: "assets/*.svg data/history.json"
